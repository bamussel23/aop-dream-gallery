<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xAA / MYCELIAL ROUTING</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #050805;
            color: #E0E0E0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #mycelium-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            mix-blend-mode: screen;
        }

        .overlay {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 1;
            text-align: left;
            pointer-events: none;
        }

        .axiom-text {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            letter-spacing: 6px;
            color: rgba(100, 255, 150, 0.6);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .entropy-core {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            font-weight: 100;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px rgba(100, 255, 150, 0.8);
            margin: 0;
        }
    </style>
</head>
<body>

    <canvas id="mycelium-canvas"></canvas>

    <div class="overlay">
        <div class="axiom-text">ORGANIC SUBSTRATE TOPOLOGY</div>
        <h1 class="entropy-core">Mycelial Routing</h1>
    </div>

    <script>
        const canvas = document.getElementById('mycelium-canvas');
        const ctx = canvas.getContext('2d', { alpha: false });

        let width, height;
        let hyphae = [];
        let nodes = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            ctx.fillStyle = '#050805';
            ctx.fillRect(0, 0, width, height);
        }

        window.addEventListener('resize', resize);
        resize();

        // Data nodes for the mycelium to find
        for(let i=0; i<100; i++) {
            nodes.push({
                x: Math.random() * width,
                y: Math.random() * height,
                size: Math.random() * 3 + 1,
                found: false
            });
        }

        class Hypha {
            constructor(x, y, angle, generation, parentColor) {
                this.x = x;
                this.y = y;
                this.angle = angle;
                this.generation = generation;
                this.speed = Math.random() * 1.5 + 0.5;
                this.life = 0;
                this.maxLife = Math.random() * 200 + 50;
                this.dead = false;
                this.thickness = Math.max(0.2, 3 - (generation * 0.3));
                
                // Slight color variation based on parent
                const hVar = (Math.random() - 0.5) * 20;
                const baseHue = parentColor ? parentColor : 120; // Start green
                this.hue = baseHue + hVar;
            }

            update() {
                if(this.dead) return;

                const prevX = this.x;
                const prevY = this.y;

                // Meander organically
                this.angle += (Math.random() - 0.5) * 0.3;
                
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life++;

                // Draw segment
                ctx.beginPath();
                ctx.moveTo(prevX, prevY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = `hsla(${this.hue}, 80%, 60%, ${1 - (this.life/this.maxLife)})`;
                ctx.lineWidth = this.thickness;
                ctx.stroke();

                // Branching logic
                if (this.life % 20 === 0 && Math.random() < 0.3 && this.generation < 8) {
                    hyphae.push(new Hypha(this.x, this.y, this.angle + (Math.random() * 1.5 + 0.5), this.generation + 1, this.hue));
                    hyphae.push(new Hypha(this.x, this.y, this.angle - (Math.random() * 1.5 + 0.5), this.generation + 1, this.hue));
                    this.dead = true; // Parent stops, branches take over
                }

                // Check for node discovery
                for(let i=0; i<nodes.length; i++) {
                    const n = nodes[i];
                    if(!n.found) {
                        const dx = this.x - n.x;
                        const dy = this.y - n.y;
                        if(dx*dx + dy*dy < 100) {
                            n.found = true;
                            // Nutrient pulse (visual flash)
                            ctx.beginPath();
                            ctx.arc(n.x, n.y, n.size * 4, 0, Math.PI * 2);
                            ctx.fillStyle = `hsla(${this.hue}, 100%, 80%, 0.8)`;
                            ctx.fill();
                            
                            // Sprout new aggressive branches towards nearby resources
                            for(let j=0; j<3; j++) {
                                hyphae.push(new Hypha(n.x, n.y, Math.random() * Math.PI * 2, this.generation, this.hue + 40));
                            }
                        }
                    }
                }

                if (this.life > this.maxLife || this.x < 0 || this.x > width || this.y < 0 || this.y > height) {
                    this.dead = true;
                }
            }
        }

        // Initial spores
        hyphae.push(new Hypha(width/2, height/2, 0, 0, 120));
        hyphae.push(new Hypha(width/2, height/2, Math.PI, 0, 140));
        hyphae.push(new Hypha(width/2, height/2, Math.PI/2, 0, 100));
        hyphae.push(new Hypha(width/2, height/2, -Math.PI/2, 0, 160));

        // Background fading
        function fade() {
            ctx.fillStyle = 'rgba(5, 8, 5, 0.02)';
            ctx.fillRect(0, 0, width, height);
            
            // Draw unfound nodes
            for(let i=0; i<nodes.length; i++) {
                if(!nodes[i].found && Math.random() < 0.05) {
                    ctx.beginPath();
                    ctx.arc(nodes[i].x, nodes[i].y, nodes[i].size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.2)';
                    ctx.fill();
                }
            }
        }

        function animate() {
            fade();

            // Run 5 cycles per frame to speed up the growth simulation
            for(let k=0; k<5; k++) {
                const len = hyphae.length;
                for(let i=0; i<len; i++) {
                    hyphae[i].update();
                }
            }

            // Cleanup dead hyphae occasionally to save memory
            if(Math.random() < 0.01) {
                hyphae = hyphae.filter(h => !h.dead);
            }

            // If network stalls, drop a new spore randomly
            if(hyphae.filter(h => !h.dead).length < 2) {
                hyphae.push(new Hypha(Math.random()*width, Math.random()*height, Math.random()*Math.PI*2, 0, Math.random()*60 + 100));
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
