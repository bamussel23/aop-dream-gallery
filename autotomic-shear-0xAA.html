<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Autotomic Shear (A31)</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #FFFFFF; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #FFFFFF; }
</style>
</head>
<body>
<div id="label">Autotomic Shear (A31)</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            function drawBranch(x,y,len,angle,depth) {
                if(depth===0 || Math.random()<0.02) { 
                    ctx.fillStyle='#F00'; ctx.fillRect(x-2,y-2,4,4); return; 
                }
                let nx = x + Math.cos(angle)*len;
                let ny = y + Math.sin(angle)*len;
                ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(nx,ny); 
                ctx.strokeStyle=`rgba(255,255,255,${depth/10})`; ctx.stroke();
                drawBranch(nx,ny,len*0.8, angle-0.5+(Math.random()-0.5)*0.2, depth-1);
                drawBranch(nx,ny,len*0.8, angle+0.5+(Math.random()-0.5)*0.2, depth-1);
            }
            setInterval(() => {
                ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(0,0,w,h);
                drawBranch(w/2, h, 150, -Math.PI/2, 10);
            }, 100);
        
</script>
</body>
</html>
