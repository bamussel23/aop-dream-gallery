<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Turing Halt Horizon</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #AA00AA; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #AA00AA; }
</style>
</head>
<body>
<div id="label">Turing Halt Horizon</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            let ps = [];
            function loop() {
                ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fillRect(0,0,w,h);
                let cx=w/2, cy=h/2;
                ctx.beginPath(); ctx.arc(cx,cy,50,0,Math.PI*2); ctx.fillStyle='#000'; ctx.fill(); ctx.strokeStyle='#A0A'; ctx.stroke();
                
                if(Math.random()<0.5) ps.push({a:Math.random()*Math.PI*2, r:Math.min(w,h)/2, halt:Math.random()<0.1});
                for(let i=ps.length-1; i>=0; i--) {
                    let p = ps[i];
                    p.r -= 2; p.a += 0.05;
                    let px = cx+Math.cos(p.a)*p.r, py = cy+Math.sin(p.a)*p.r;
                    if(p.halt && p.r < 100) { p.r += 10; p.a += 0.2; ctx.fillStyle='#0F0'; } // Escapes
                    else ctx.fillStyle='#FFF';
                    ctx.beginPath(); ctx.arc(px,py,2,0,Math.PI*2); ctx.fill();
                    if(p.r<50 || p.r>w) ps.splice(i,1);
                }
                requestAnimationFrame(loop);
            } loop();
        
</script>
</body>
</html>
