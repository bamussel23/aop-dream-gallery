<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xAA / ENTROPIC SLIME MOLD</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
        canvas { position: absolute; top: 0; left: 0; }
        .hud { position: absolute; bottom: 20px; right: 20px; z-index: 10; color: #DDFF00; text-shadow: 0 0 10px #DDFF00; font-size: 16px; text-align: right; }
    </style>
</head>
<body>
    <div class="hud">PHYSARUM POLYCEPHALUM<br>OPTIMAL PATHFINDING</div>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);
        }
        window.addEventListener('resize', resize);
        resize();

        class Agent {
            constructor() {
                this.x = w/2;
                this.y = h/2;
                this.angle = Math.random() * Math.PI * 2;
                this.speed = 2;
            }
            update() {
                // Random wander
                this.angle += (Math.random() - 0.5) * 0.5;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                
                // Wrap
                if(this.x < 0) this.x += w;
                if(this.x >= w) this.x -= w;
                if(this.y < 0) this.y += h;
                if(this.y >= h) this.y -= h;

                ctx.fillStyle = 'rgba(200, 255, 0, 0.1)';
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        const agents = [];
        for(let i=0; i<15000; i++) agents.push(new Agent());

        // Food nodes
        const food = [];
        for(let i=0; i<10; i++) food.push({x: Math.random()*w, y: Math.random()*h});

        function animate() {
            // Fade / Decay
            ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
            ctx.fillRect(0,0,w,h);

            for(let a of agents) {
                // Steer towards food if close
                let closestDist = 10000;
                let closestFood = null;
                for(let f of food) {
                    const dx = f.x - a.x;
                    const dy = f.y - a.y;
                    const dist = Math.sqrt(dx*dx + dy*dy);
                    if (dist < 150 && dist < closestDist) {
                        closestDist = dist;
                        closestFood = f;
                    }
                }

                if (closestFood) {
                    const targetAngle = Math.atan2(closestFood.y - a.y, closestFood.x - a.x);
                    // Steer towards
                    const diff = targetAngle - a.angle;
                    a.angle += Math.sin(diff) * 0.1;
                }

                a.update();
            }

            // Draw food
            for(let f of food) {
                ctx.beginPath();
                ctx.arc(f.x, f.y, 5, 0, Math.PI*2);
                ctx.fillStyle = '#FFF';
                ctx.shadowBlur = 15;
                ctx.shadowColor = '#DDFF00';
                ctx.fill();
                ctx.shadowBlur = 0;
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
