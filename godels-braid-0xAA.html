<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gödel's Braid (A11)</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #FF00AA; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #FF00AA; }
</style>
</head>
<body>
<div id="label">Gödel's Braid (A11)</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            let t = 0;
            function loop() {
                ctx.fillStyle = 'rgba(1,1,3,0.1)'; ctx.fillRect(0,0,w,h);
                t += 0.02;
                let cx = w/2, cy = h/2;
                for(let i=0; i<3; i++) {
                    let offset = i * (Math.PI * 2 / 3);
                    ctx.beginPath();
                    for(let j=0; j<100; j++) {
                        let a = t + j*0.1 + offset;
                        let r = 100 + Math.sin(t*2 + j*0.05)*50;
                        let x = cx + Math.cos(a)*r * Math.sin(t*0.5);
                        let y = cy + Math.sin(a)*r * Math.cos(t*0.5);
                        ctx.lineTo(x, y);
                    }
                    ctx.strokeStyle = `hsla(${t*50 + i*120}, 100%, 50%, 0.8)`;
                    ctx.lineWidth = 2; ctx.stroke();
                }
                requestAnimationFrame(loop);
            } loop();
        
</script>
</body>
</html>
