<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Drinfeld Twist Coproducts</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #AA00FF; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #AA00FF; }
</style>
</head>
<body>
<div id="label">Drinfeld Twist Coproducts</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            let t=0;
            function loop() {
                ctx.fillStyle='rgba(0,0,0,0.1)'; ctx.fillRect(0,0,w,h);
                t+=0.05;
                for(let i=0;i<w;i+=40) {
                    for(let j=0;j<h;j+=40) {
                        let a1 = Math.sin(i*0.01 + t) * Math.cos(j*0.01 + t);
                        let a2 = Math.cos(i*0.02 - t) * Math.sin(j*0.02 - t);
                        ctx.beginPath(); ctx.moveTo(i,j);
                        ctx.lineTo(i+Math.cos(a1)*20, j+Math.sin(a1)*20);
                        ctx.strokeStyle='rgba(0,255,200,0.5)'; ctx.stroke();
                        ctx.beginPath(); ctx.moveTo(i,j);
                        ctx.lineTo(i+Math.cos(a2)*20, j+Math.sin(a2)*20);
                        ctx.strokeStyle='rgba(255,0,200,0.5)'; ctx.stroke();
                    }
                }
                requestAnimationFrame(loop);
            } loop();
        
</script>
</body>
</html>
