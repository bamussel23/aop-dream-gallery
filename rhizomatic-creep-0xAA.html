<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Rhizomatic Creep</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #AAFF00; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #AAFF00; }
</style>
</head>
<body>
<div id="label">Rhizomatic Creep</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            let roots = Array.from({length:10}, ()=>({x:Math.random()*w, y:Math.random()*h, a:Math.random()*Math.PI*2}));
            ctx.fillStyle='#000'; ctx.fillRect(0,0,w,h);
            function loop() {
                roots.forEach(r => {
                    r.a += (Math.random()-0.5)*0.5;
                    let nx = r.x + Math.cos(r.a)*2;
                    let ny = r.y + Math.sin(r.a)*2;
                    ctx.beginPath(); ctx.moveTo(r.x, r.y); ctx.lineTo(nx, ny);
                    ctx.strokeStyle='rgba(170,255,0,0.5)'; ctx.stroke();
                    r.x=nx; r.y=ny;
                    if(Math.random()<0.01) roots.push({x:nx, y:ny, a:r.a+Math.PI/2});
                });
                if(roots.length>500) roots.splice(0,10);
                requestAnimationFrame(loop);
            } loop();
        
</script>
</body>
</html>
