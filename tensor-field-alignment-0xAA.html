<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tensor Field Alignment</title>
<style>
  body, html { margin: 0; padding: 0; background: #010103; overflow: hidden; }
  canvas { display: block; }
  #label { position: absolute; top: 20px; left: 20px; color: #00FF00; font-family: monospace; font-size: 14px; z-index: 10; pointer-events: none; letter-spacing: 4px; text-transform: uppercase; text-shadow: 0 0 10px #00FF00; }
</style>
</head>
<body>
<div id="label">Tensor Field Alignment</div>
<canvas id="c"></canvas>
<script>
  const c = document.getElementById('c');
  const ctx = c.getContext('2d');
  let w = c.width = window.innerWidth;
  let h = c.height = window.innerHeight;
  window.onresize = () => { w = c.width = window.innerWidth; h = c.height = window.innerHeight; };
  
            let t=0;
            function loop() {
                ctx.fillStyle='rgba(0,0,0,1)'; ctx.fillRect(0,0,w,h);
                t+=5; let sweep = t%w;
                for(let x=20; x<w; x+=20) {
                    for(let y=20; y<h; y+=20) {
                        let angle = (x < sweep) ? 0 : Math.random()*Math.PI*2;
                        ctx.save(); ctx.translate(x,y); ctx.rotate(angle);
                        ctx.strokeStyle=(x<sweep)?'#0F0':'#555';
                        ctx.beginPath(); ctx.moveTo(-8,0); ctx.lineTo(8,0); ctx.stroke();
                        ctx.restore();
                    }
                }
                ctx.fillStyle='rgba(0,255,0,0.2)'; ctx.fillRect(sweep,0,10,h);
                requestAnimationFrame(loop);
            } loop();
        
</script>
</body>
</html>
