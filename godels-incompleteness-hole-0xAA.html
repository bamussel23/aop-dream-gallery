<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xAA / GÖDEL'S INCOMPLETENESS HOLE</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; font-family: monospace; color: #fff; }
        canvas { position: absolute; top: 0; left: 0; }
        .hud { position: absolute; bottom: 20px; left: 20px; z-index: 10; color: #F00; text-shadow: 0 0 10px #F00; font-size: 16px; }
    </style>
</head>
<body>
    <div class="hud">A11: AXIOMATIC PARADOX / UNDECIDABLE HOLE</div>
    <canvas id="c"></canvas>
    <script>
        const canvas = document.getElementById('c');
        const ctx = canvas.getContext('2d');
        let w, h, cx, cy;
        
        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            cx = w/2; cy = h/2;
        }
        window.addEventListener('resize', resize);
        resize();

        let time = 0;

        function animate() {
            ctx.fillStyle = '#000';
            ctx.fillRect(0,0,w,h);
            time += 0.05;

            ctx.strokeStyle = 'rgba(255, 0, 0, 0.4)';
            ctx.lineWidth = 1;

            const spacing = 30;
            const strength = 15000 + Math.sin(time) * 5000; // Pulsing black hole

            // Draw distorted grid
            ctx.beginPath();
            for(let x=-w; x<w*2; x+=spacing) {
                for(let y=-h; y<h*2; y+=5) {
                    let dx = x - cx;
                    let dy = y - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let pull = strength / (dist + 1);
                    
                    // Spiral distortion
                    const angle = Math.atan2(dy, dx) + pull * 0.01;
                    const r = Math.max(5, dist - pull * 0.1);

                    const px = cx + Math.cos(angle) * r;
                    const py = cy + Math.sin(angle) * r;

                    if(y === -h) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            ctx.beginPath();
            for(let y=-h; y<h*2; y+=spacing) {
                for(let x=-w; x<w*2; x+=5) {
                    let dx = x - cx;
                    let dy = y - cy;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    let pull = strength / (dist + 1);
                    
                    const angle = Math.atan2(dy, dx) + pull * 0.01;
                    const r = Math.max(5, dist - pull * 0.1);

                    const px = cx + Math.cos(angle) * r;
                    const py = cy + Math.sin(angle) * r;

                    if(x === -w) ctx.moveTo(px, py);
                    else ctx.lineTo(px, py);
                }
            }
            ctx.stroke();

            // The absolute dark hole
            ctx.beginPath();
            ctx.arc(cx, cy, 20, 0, Math.PI*2);
            ctx.fillStyle = '#000';
            ctx.shadowBlur = 50;
            ctx.shadowColor = '#F00';
            ctx.fill();
            ctx.shadowBlur = 0;

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
