<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xAA / CHRONOLOGICAL BACK-PROPAGATION</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            color: #E0E0E0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'JetBrains Mono', monospace;
        }

        #time-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            mix-blend-mode: screen;
        }

        .overlay {
            position: absolute;
            top: 40px;
            right: 40px;
            z-index: 1;
            text-align: right;
            pointer-events: none;
        }

        .axiom-text {
            font-size: 10px;
            letter-spacing: 6px;
            color: rgba(255, 200, 0, 0.6);
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .entropy-core {
            font-size: 24px;
            font-weight: 100;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 200, 0, 0.8);
            margin: 0;
        }
        
        .hud {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.5);
            margin-top: 15px;
            letter-spacing: 2px;
        }
        
        #timeline {
            font-size: 16px;
            font-weight: 700;
            color: #FFCC00;
            margin-top: 5px;
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body>

    <canvas id="time-canvas"></canvas>

    <div class="overlay">
        <div class="axiom-text">TIME-REVERSED ENTROPY</div>
        <h1 class="entropy-core">Back-Propagation</h1>
        <div class="hud">
            SYSTEM ENTROPY VECTOR (ΔS)<br>
            <div id="timeline">ΔS < 0 (CONVERGING)</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('time-canvas');
        const ctx = canvas.getContext('2d');
        const timelineEl = document.getElementById('timeline');

        let width, height, cx, cy;
        let particles = [];
        const P_COUNT = 3000;
        
        let time = 0; 
        const DURATION = 300; // frames for a full convergence cycle

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            cx = width / 2;
            cy = height / 2;
        }

        window.addEventListener('resize', resize);
        resize();

        // Target shape: A complex geometric primitive (intersecting sacred geometry)
        function generateTargetGeometry() {
            const targets = [];
            const radius = Math.min(width, height) * 0.35;
            
            // Shape 1: Outer Hexagon
            for(let i=0; i<6; i++) {
                const angle1 = (Math.PI / 3) * i;
                const angle2 = (Math.PI / 3) * (i+1);
                
                // Interpolate points along the line
                for(let j=0; j<200; j++) {
                    const t = j / 200;
                    const x = cx + radius * Math.cos(angle1) * (1-t) + radius * Math.cos(angle2) * t;
                    const y = cy + radius * Math.sin(angle1) * (1-t) + radius * Math.sin(angle2) * t;
                    targets.push({x, y});
                }
            }

            // Shape 2: Inner Star (Hexagram)
            for(let i=0; i<6; i++) {
                const angle1 = (Math.PI / 3) * i;
                const angle2 = (Math.PI / 3) * (i+2); // Skip one vertex to make a star
                
                for(let j=0; j<150; j++) {
                    const t = j / 150;
                    const x = cx + radius * Math.cos(angle1) * (1-t) + radius * Math.cos(angle2) * t;
                    const y = cy + radius * Math.sin(angle1) * (1-t) + radius * Math.sin(angle2) * t;
                    targets.push({x, y});
                }
            }
            
            // Shape 3: Center dense circle
            for(let j=0; j<900; j++) {
                const r = Math.random() * (radius * 0.3);
                const angle = Math.random() * Math.PI * 2;
                targets.push({x: cx + Math.cos(angle) * r, y: cy + Math.sin(angle) * r});
            }

            return targets;
        }

        class Particle {
            constructor(targetX, targetY) {
                this.targetX = targetX;
                this.targetY = targetY;
                
                // Totally chaotic starting position far off-screen
                this.startX = cx + (Math.random() - 0.5) * width * 3;
                this.startY = cy + (Math.random() - 0.5) * height * 3;
                
                this.x = this.startX;
                this.y = this.startY;
                
                // Per-particle time offset to make convergence look organic instead of linear
                this.easeOffset = Math.random();
                
                // Colors shift from chaotic red to perfect geometric gold
                this.hueStart = Math.random() * 60; // Red/orange
                this.hueEnd = 45; // Perfect gold
            }

            update(progress) {
                // Easing function (starts slow, snaps into place fast)
                // cubic-bezier style easing
                let t = progress;
                // Add individual offset jitter when far away, tightens to 0 as progress -> 1
                let ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
                
                // Add swirling noise that decays to zero
                const noiseScale = (1 - ease) * 200;
                const noiseX = Math.sin(this.easeOffset * 100 + t * 10) * noiseScale;
                const noiseY = Math.cos(this.easeOffset * 100 + t * 10) * noiseScale;

                this.x = this.startX + (this.targetX - this.startX) * ease + noiseX;
                this.y = this.startY + (this.targetY - this.startY) * ease + noiseY;
                
                this.currentHue = this.hueStart + (this.hueEnd - this.hueStart) * ease;
                this.opacity = 0.2 + (0.8 * ease);
            }

            draw() {
                ctx.fillStyle = `hsla(${this.currentHue}, 100%, 60%, ${this.opacity})`;
                ctx.fillRect(this.x, this.y, 1.5, 1.5);
            }
        }

        function initParticles() {
            particles = [];
            const targets = generateTargetGeometry();
            
            // Shuffle targets to randomize mapping
            targets.sort(() => Math.random() - 0.5);

            for(let i=0; i<P_COUNT && i<targets.length; i++) {
                particles.push(new Particle(targets[i].x, targets[i].y));
            }
        }

        initParticles();

        function animate() {
            // Calculate progress (0.0 to 1.0)
            let progress = time / DURATION;
            if (progress > 1.0) progress = 1.0;

            if (progress < 0.99) {
                timelineEl.textContent = "ΔS < 0 (CONVERGING)";
                timelineEl.style.color = "#FFCC00";
                
                // Normal motion blur
                ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
                ctx.fillRect(0, 0, width, height);
            } else {
                timelineEl.textContent = "ΔS = 0 (PERFECT PARITY)";
                timelineEl.style.color = "#00FF88";
                
                // Crystal clear render when locked
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(0, 0, width, height);
                
                // Golden geometric glow
                ctx.shadowBlur = 15;
                ctx.shadowColor = 'rgba(255, 200, 0, 0.5)';
            }

            for(let i=0; i<particles.length; i++) {
                particles[i].update(progress);
                particles[i].draw();
            }
            ctx.shadowBlur = 0; // reset

            time++;

            // Hold at perfection for 100 frames, then explode back to chaos
            if (time > DURATION + 100) {
                time = 0;
                initParticles(); // generate new random starting points
                
                // White explosion flash
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(0, 0, width, height);
            }

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
