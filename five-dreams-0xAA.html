<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Five Dreams 0xAA</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #010103;
    color: #f7f3ff;
    font-family: "JetBrains Mono", "SF Mono", Menlo, monospace;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  .hud {
    position: fixed;
    left: 22px;
    top: 20px;
    z-index: 3;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.18em;
    text-shadow: 0 0 18px currentColor;
  }
  .hud h1 {
    margin: 0 0 8px;
    font-size: 13px;
    font-weight: 700;
    color: #ff6a00;
  }
  .hud p {
    margin: 3px 0;
    font-size: 10px;
    color: rgba(247, 243, 255, 0.62);
  }
  .seed {
    color: #9dffcb;
  }
  .veil {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(circle at 35% 40%, rgba(163, 81, 255, 0.08), transparent 34%),
      radial-gradient(circle at 72% 64%, rgba(0, 255, 198, 0.07), transparent 30%),
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: auto, auto, 100% 4px;
    mix-blend-mode: screen;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="hud">
  <h1>AXIOM A31 // 0xAA DREAM</h1>
  <p>SEED: <span class="seed" id="seed">Gravity Well Choir</span></p>
  <p>Five chambers sharing one sleep-state</p>
</div>
<div class="veil"></div>
<script>
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false });
const seedLabel = document.getElementById("seed");

let w = 0;
let h = 0;
let dpr = 1;
let t = 0;
let chamber = 0;
const seeds = [
  "Gravity Well Choir",
  "Glass Tides",
  "Memory Bloom Reactor",
  "Black Sun Lattice",
  "Signal Rain Cathedral"
];

function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  w = Math.floor(innerWidth * dpr);
  h = Math.floor(innerHeight * dpr);
  canvas.width = w;
  canvas.height = h;
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}
addEventListener("resize", resize);
resize();

const choir = Array.from({ length: 420 }, (_, i) => ({
  r: 20 + Math.random() * Math.min(w, h) * 0.45,
  a: Math.random() * Math.PI * 2,
  s: 0.002 + Math.random() * 0.012,
  tone: i / 420
}));

const blooms = Array.from({ length: 86 }, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  vx: (Math.random() - 0.5) * 0.8,
  vy: (Math.random() - 0.5) * 0.8,
  age: Math.random() * 400,
  hue: 90 + Math.random() * 210
}));

const rain = Array.from({ length: 170 }, () => ({
  x: Math.random() * w,
  y: Math.random() * h,
  v: 2 + Math.random() * 7,
  l: 12 + Math.random() * 48,
  hue: 150 + Math.random() * 120
}));

function fade(alpha = 0.09) {
  ctx.fillStyle = `rgba(1, 1, 3, ${alpha})`;
  ctx.fillRect(0, 0, w, h);
}

function line(x1, y1, x2, y2, color, width = 1) {
  ctx.strokeStyle = color;
  ctx.lineWidth = width * dpr;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function gravityWellChoir(power) {
  const cx = w * 0.5;
  const cy = h * 0.5;
  for (let i = 0; i < 5; i++) {
    const a = t * 0.22 + i * Math.PI * 0.4;
    const x = cx + Math.cos(a) * Math.min(w, h) * 0.18;
    const y = cy + Math.sin(a * 1.4) * Math.min(w, h) * 0.14;
    const g = ctx.createRadialGradient(x, y, 0, x, y, Math.min(w, h) * 0.22);
    g.addColorStop(0, `rgba(255,106,0,${0.18 * power})`);
    g.addColorStop(1, "rgba(255,106,0,0)");
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
  }
  choir.forEach((p, i) => {
    p.a += p.s * (0.6 + power);
    const warp = Math.sin(t * 0.7 + p.tone * 18) * 42 * dpr;
    const x = cx + Math.cos(p.a) * (p.r + warp);
    const y = cy + Math.sin(p.a * 1.17) * (p.r * 0.63 + warp * 0.4);
    ctx.fillStyle = `hsla(${22 + p.tone * 70}, 100%, 62%, ${0.18 + 0.55 * power})`;
    ctx.fillRect(x, y, 1.6 * dpr, 1.6 * dpr);
    if (i % 23 === 0) line(cx, cy, x, y, `rgba(255,106,0,${0.025 * power})`, 0.6);
  });
}

function glassTides(power) {
  for (let y = -80 * dpr; y < h + 80 * dpr; y += 28 * dpr) {
    ctx.beginPath();
    for (let x = -20 * dpr; x <= w + 20 * dpr; x += 18 * dpr) {
      const yy = y + Math.sin(x * 0.006 + t * 1.9 + y * 0.01) * 34 * dpr;
      if (x < 0) ctx.moveTo(x, yy);
      else ctx.lineTo(x, yy);
    }
    ctx.strokeStyle = `rgba(138, 231, 255, ${0.035 + 0.16 * power})`;
    ctx.lineWidth = 1.2 * dpr;
    ctx.stroke();
  }
  for (let i = 0; i < 9; i++) {
    const x = ((t * 24 * dpr) + i * w / 7) % (w + 220 * dpr) - 110 * dpr;
    const g = ctx.createLinearGradient(x - 90 * dpr, 0, x + 90 * dpr, h);
    g.addColorStop(0, "rgba(255,255,255,0)");
    g.addColorStop(0.5, `rgba(190,245,255,${0.045 * power})`);
    g.addColorStop(1, "rgba(255,255,255,0)");
    ctx.fillStyle = g;
    ctx.fillRect(x - 100 * dpr, 0, 200 * dpr, h);
  }
}

function memoryBloomReactor(power) {
  blooms.forEach((b, i) => {
    b.x += b.vx * dpr + Math.sin(t + i) * 0.18 * dpr;
    b.y += b.vy * dpr + Math.cos(t * 0.8 + i) * 0.18 * dpr;
    b.age += 1;
    if (b.x < 0) b.x = w;
    if (b.x > w) b.x = 0;
    if (b.y < 0) b.y = h;
    if (b.y > h) b.y = 0;
    const r = (3 + Math.sin(b.age * 0.025) * 2 + (b.age % 90) * 0.08) * dpr;
    for (let k = 0; k < 7; k++) {
      const a = k * Math.PI * 2 / 7 + t * 0.2 + b.age * 0.01;
      line(b.x, b.y, b.x + Math.cos(a) * r * 2.8, b.y + Math.sin(a) * r * 2.8,
        `hsla(${b.hue + k * 12}, 100%, 64%, ${0.045 + 0.16 * power})`, 0.8);
    }
    ctx.fillStyle = `hsla(${b.hue}, 100%, 70%, ${0.2 + 0.4 * power})`;
    ctx.beginPath();
    ctx.arc(b.x, b.y, Math.max(1.2 * dpr, r * 0.2), 0, Math.PI * 2);
    ctx.fill();
  });
}

function blackSunLattice(power) {
  const cx = w * 0.5;
  const cy = h * 0.5;
  const radius = Math.min(w, h) * (0.13 + Math.sin(t * 0.4) * 0.025);
  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 4);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(0.22, `rgba(0,0,0,${0.95 * power})`);
  g.addColorStop(0.28, `rgba(157,81,255,${0.42 * power})`);
  g.addColorStop(1, "rgba(0,0,0,0)");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  for (let a = 0; a < Math.PI * 2; a += Math.PI / 34) {
    const pull = 1 + Math.sin(t * 1.3 + a * 5) * 0.22;
    const x1 = cx + Math.cos(a) * radius * pull;
    const y1 = cy + Math.sin(a) * radius * pull;
    const x2 = cx + Math.cos(a + Math.sin(t + a) * 0.18) * Math.min(w, h) * 0.55;
    const y2 = cy + Math.sin(a + Math.cos(t + a) * 0.18) * Math.min(w, h) * 0.55;
    line(x1, y1, x2, y2, `rgba(157,81,255,${0.05 + 0.22 * power})`, 1.0);
  }
  ctx.fillStyle = "#000";
  ctx.beginPath();
  ctx.arc(cx, cy, radius, 0, Math.PI * 2);
  ctx.fill();
}

function signalRainCathedral(power) {
  const floor = h * 0.82;
  rain.forEach((r) => {
    r.y += r.v * dpr;
    if (r.y > floor) {
      const arch = Math.min(80 * dpr, (r.y - floor) * 4);
      ctx.strokeStyle = `hsla(${r.hue}, 100%, 60%, ${0.05 + 0.22 * power})`;
      ctx.lineWidth = 1 * dpr;
      ctx.beginPath();
      ctx.arc(r.x, floor, arch, Math.PI, Math.PI * 2);
      ctx.stroke();
      if (r.y > h + 40 * dpr) {
        r.x = Math.random() * w;
        r.y = -Math.random() * h * 0.4;
      }
    } else {
      line(r.x, r.y, r.x, r.y + r.l * dpr, `hsla(${r.hue},100%,62%,${0.08 + 0.34 * power})`, 1);
    }
  });
  line(0, floor, w, floor, `rgba(0,255,198,${0.12 * power})`, 1);
}

function chamberPower(i) {
  const phase = (t * 0.055 + i / seeds.length) % 1;
  return Math.pow(0.5 + 0.5 * Math.cos((phase - 0.5) * Math.PI * 2), 2.6);
}

function loop() {
  t += 0.016;
  const active = Math.floor((t * 0.055 % 1) * seeds.length);
  if (active !== chamber) {
    chamber = active;
    seedLabel.textContent = seeds[chamber];
  }
  fade(0.08);
  gravityWellChoir(chamberPower(0));
  glassTides(chamberPower(1));
  memoryBloomReactor(chamberPower(2));
  blackSunLattice(chamberPower(3));
  signalRainCathedral(chamberPower(4));
  requestAnimationFrame(loop);
}

ctx.fillStyle = "#010103";
ctx.fillRect(0, 0, w, h);
loop();
</script>
</body>
</html>
